# ── MAIN CONTEXT ─────────────────────────────────────────────────────────────
worker_processes 2;          # Match your CPU cores

events {
    worker_connections 2048; # Per worker → 2 × 2048 = 4096 total connections
    use epoll;               # Linux async I/O — much faster than default
    multi_accept on;         # Accept multiple connections per event loop tick
}

# ── HTTP CONTEXT ─────────────────────────────────────────────────────────────
http {

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;    # Send headers and body together
    tcp_nodelay        on;    # Disable Nagle algorithm for low latency

    keepalive_timeout  30;
    keepalive_requests 1000;

    # ── Gzip Compression ─────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;      # 1–9 scale: 5 is sweet spot (speed vs size)
    gzip_min_length   1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml;

    # ── Proxy Buffer Tuning ───────────────────────────────────────────────────
    proxy_buffering    on;
    proxy_buffer_size  8k;
    proxy_buffers      16 8k;
    proxy_busy_buffers_size 16k;

    # ── Rate Limiting Zone ───────────────────────────────────────────────────
    # Stores state for 10MB (~160,000 IPs) — rate: 10 requests/sec per IP
    limit_req_zone $binary_remote_addr zone=result_lookup:10m rate=10r/s;

    # ── Proxy Cache ──────────────────────────────────────────────────────────
    # Cache lives in /tmp/nginx_cache, max 500MB, purged after 5min inactivity
    proxy_cache_path /tmp/nginx_cache
                     levels=1:2
                     keys_zone=result_cache:10m
                     max_size=500m
                     inactive=5m
                     use_temp_path=off;  # Write directly — avoids extra copy

    # ── Upstream (Gunicorn) ───────────────────────────────────────────────────
    upstream django {
        server web:8000;
        keepalive 32;   # Keep 32 persistent connections to Gunicorn
    }

    # ── Server Block ─────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        error_page 429 /429.html;
        location = /429.html {
            root /app/static/;
            internal;
        }
        # ── Security Headers ─────────────────────────────────────────────────
        add_header X-Frame-Options       DENY            always;
        add_header X-Content-Type-Options nosniff        always;
        add_header X-XSS-Protection      "1; mode=block" always;
        add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

        # ── Static Files (served by Nginx directly — never hits Django) ──────
        location /static/ {
            alias        /app/static/;
            expires      30d;
            access_log   off;
            add_header   Cache-Control "public, immutable";
        }

        # ── Media Files ───────────────────────────────────────────────────────
        location /media/ {
            alias      /app/media/;
            expires    7d;
            access_log off;
        }

        # ── Main App ─────────────────────────────────────────────────────────
        location / {

            # Rate limiting — burst of 20 allows short spikes, nodelay = no queue
            limit_req zone=result_lookup burst=20 nodelay;        

            # Proxy cache — only caches GET/HEAD, never POST (form submissions)
            proxy_cache        result_cache;
            proxy_cache_valid  200 2m;
            proxy_cache_valid  404 1m;
            proxy_cache_methods GET HEAD;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
            proxy_cache_key    "$scheme$request_method$host$request_uri";
            add_header         X-Cache-Status $upstream_cache_status; # HIT/MISS header

            # Pass to Gunicorn via upstream block
            proxy_pass         http://django;
            proxy_http_version 1.1;                    # Required for keepalive
            proxy_set_header   Connection "";           # Required for keepalive
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_redirect     off;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;
        }
    }
}
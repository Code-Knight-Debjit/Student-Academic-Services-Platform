worker_processes 2;          # match CPU cores
worker_connections 2048;     # per worker = 4096 total connections

events {
    worker_processes 2;
    worker_connections 2048;
    use epoll;               # Linux async I/O - much faster
    multi_accept on;
}

http {
    # Enable connection keepalive - massive performance win
    keepalive_timeout 30;
    keepalive_requests 1000;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1000;

    # Buffer tuning
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 16 8k;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=result_lookup:10m rate=10r/s;
}

proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=result_cache:10m max_size=500m inactive=5m;

location / {
    proxy_cache result_cache;
    proxy_cache_valid 200 2m;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_key "$request_method$request_uri";

    # Don't cache POST requests (form submissions)
    proxy_cache_methods GET HEAD;

    limit_req zone=result_lookup burst=20 nodelay;

    proxy_pass http://web:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

server {
    listen 80;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    location /static/ {
        alias /app/static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://web:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Important for Django
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }
}
version: "3.9"

services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: django_app
    restart: always
    command: >
      sh -c "
      echo 'Waiting for database...' &&
      until pg_isready -h db -p 5432 -U ${DB_USER}; do
        sleep 2;
      done &&
      echo 'Database is ready!' &&

      python manage.py migrate &&
      python manage.py collectstatic --noinput &&

      DJANGO_SUPERUSER_PASSWORD=${ADMIN_PASSWORD} \
      python manage.py createsuperuser \
        --noinput \
        --username ${ADMIN_USERNAME} \
        --email ${ADMIN_EMAIL} || true &&

      gunicorn student_results.wsgi:application \
        --bind 0.0.0.0:8000 \
        --workers 5 \
        --threads 2 \
        --timeout 120
      "
    volumes:
      - .:/app
      - static_volume:/app/static
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:latest
    container_name: nginx_server
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    restart: always
    command: tunnel run my-tunnel
    volumes:
      - ~/.cloudflared:/etc/cloudflared
    depends_on:
      - nginx
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "info", "my-tunnel"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  static_volume:
name: Run Tests

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: self-hosted

    services:
      postgres:
        image: postgres:15
        ports:
          - 127.0.0.1:5433:5432
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # ── NEW: Redis service container ───────────────────────────────────────
      redis:
        image: redis:7-alpine
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    env:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: test_db
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_HOST: localhost
      DB_PORT: 5433
      SECRET_KEY: test-secret-key-for-ci-only
      DEBUG: "True"
      RAZORPAY_KEY_ID: dummy_key
      RAZORPAY_KEY_SECRET: dummy_secret
      # ── NEW: Point Django cache layer at the Redis service container ───────
      REDIS_URL: redis://localhost:6379/1

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5433 -U test_user; do
            echo "Waiting for postgres..."
            sleep 2
          done

      # ── NEW: Wait for Redis before running tests ───────────────────────────
      - name: Wait for Redis
        run: |
          until redis-cli -h localhost -p 6379 ping | grep -q PONG; do
            echo "Waiting for redis..."
            sleep 2
          done

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests with coverage
        run: |
          pip install coverage
          coverage run manage.py test results.tests --verbosity=2
          coverage report --fail-under=70
          coverage xml

      # ── NEW: Verify Redis was actually used during the test run ───────────
      - name: Verify Redis connectivity
        if: always()
        run: |
          echo "Keys written to Redis during tests:"
          redis-cli -h localhost -p 6379 -n 1 KEYS "sasp:*" || echo "No sasp:* keys found (expected if tests clear cache)"
          echo "Redis DB size (db 1):"
          redis-cli -h localhost -p 6379 -n 1 DBSIZE

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

      - name: Notify on failure
        if: failure()
        run: echo "::error::Tests failed! Check the logs above."
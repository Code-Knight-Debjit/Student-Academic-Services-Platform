version: "3.9"

services:

  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    mem_limit: 1536m           # ✅ Actually enforced (not deploy.resources)
    cpus: 0.7
    mem_reservation: 256m
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=16MB
      -c max_connections=100
      -c wal_buffers=16MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ✅ NO ports: - Postgres stays internal only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
      image: redis:7-alpine
      container_name: redis_cache
      restart: always
      mem_limit: 512m
      cpus: 0.1
      command: >
        redis-server
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --save ""
        --appendonly no
      volumes:
        - redis_data:/data
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 10s
        timeout: 3s
        retries: 5

  web:
    build: .
    container_name: django_app
    restart: always
    mem_limit: 1536m           # ✅ Actually enforced
    cpus: 1.0
    mem_reservation: 512m
    # ✅ NO ports: - web is only reachable via Nginx internally
    command: >
      sh -c "
      echo 'Waiting for database...' &&
      until pg_isready -h db -p 5432 -U ${DB_USER}; do
        sleep 2;
      done &&
      echo 'Database is ready!' &&
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      python manage.py createsuperuser --noinput || true &&
      gunicorn --config gunicorn_config.py student_results.wsgi:application
      "
    volumes:
      # ✅ NO bind mount of . :/app in production
      - static_volume:/app/static
    depends_on:
      db:
        condition: service_healthy
      redis:                     # ✅ Wait for Redis too
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: ${REDIS_URL}   # ✅ Pass Redis URL to Django
      REDIS_URL_2: ${REDIS_URL_2} # ✅ Pass second Redis URL to Django
      DJANGO_SUPERUSER_PASSWORD: ${ADMIN_PASSWORD}
      DJANGO_SUPERUSER_USERNAME: ${ADMIN_USERNAME}
      DJANGO_SUPERUSER_EMAIL: ${ADMIN_EMAIL}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:latest
    container_name: nginx_server
    restart: always
    mem_limit: 128m            # ✅ Actually enforced
    cpus: 0.2
    ports:
      - "80:80"                # ✅ Only Nginx is public-facing
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf  # ✅ Root config, not conf.d/
      - static_volume:/app/static
      - nginx_cache:/tmp/nginx_cache        # ✅ Persistent cache volume
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    restart: always
    mem_limit: 64m             # ✅ Cloudflared is very lightweight
    cpus: 0.1
    command: tunnel --no-autoupdate run 9e4708c6-59f4-4b32-bce3-8a906b3adb2d
    volumes:
      - /home/code_knight_debjit/.cloudflared:/home/nonroot/.cloudflared:ro
    depends_on:
      - nginx
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "info", "9e4708c6-59f4-4b32-bce3-8a906b3adb2d"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  static_volume:
  nginx_cache:                 # ✅ Persistent volume for Nginx proxy cache
  redis_data:
version: "3.9"

services:
  db:
    deploy:
      resources:
        limits:
          cpus: "0.7"
          memory: 1536M
    image: postgres:15
    container_name: postgres_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=16MB
      -c max_connections=100
      -c wal_buffers=16MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M      # 1.5 GB
        reservations:
          memory: 512M
    build: .
    container_name: django_app
    restart: always
    ports:
      - "8000:8000"
    command: >
      sh -c "
      echo 'Waiting for database...' &&
      until pg_isready -h db -p 5432 -U ${DB_USER}; do
        sleep 2;
      done &&
      echo 'Database is ready!' &&

      python manage.py migrate &&
      python manage.py collectstatic --noinput &&

      python manage.py createsuperuser --noinput || true &&

      gunicorn --config gunicorn_config.py student_results.wsgi:application
      "
    volumes:
      - .:/app
      - static_volume:/app/static
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_SUPERUSER_PASSWORD: ${ADMIN_PASSWORD}
      DJANGO_SUPERUSER_USERNAME: ${ADMIN_USERNAME}
      DJANGO_SUPERUSER_EMAIL: ${ADMIN_EMAIL}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
    image: nginx:latest
    container_name: nginx_server
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    restart: always
    command: tunnel --no-autoupdate run 9e4708c6-59f4-4b32-bce3-8a906b3adb2d
    volumes:
      - /home/code_knight_debjit/.cloudflared:/home/nonroot/.cloudflared:ro
    depends_on:
      - nginx
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "info", "9e4708c6-59f4-4b32-bce3-8a906b3adb2d"]
      interval: 30s
      timeout: 10s
      retries: 3
  redis:
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 512M
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
volumes:
  postgres_data:
  static_volume:
